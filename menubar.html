<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Crouton</title>
    <link rel="stylesheet" href="menubar.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-mark"></div>
          <span class="brand-name">Crouton</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="settings-btn" title="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <!-- Vault chooser (shown when no vault is set) -->
      <section id="setup" class="setup hidden">
        <p class="setup-title">Set up Crouton</p>
        <p class="setup-sub">Choose your Obsidian vault. New sessions will be saved as markdown notes inside a <code>Crouton/</code> subfolder.</p>
        <button class="primary-btn" id="pick-vault-btn">Choose Obsidian vault…</button>
      </section>

      <!-- Main session UI -->
      <section id="main" class="main hidden">
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Ready</span>
          <span class="status-time" id="status-time"></span>
        </div>

        <input type="text" id="title-input" class="title-input" placeholder="Session title (optional)" />

        <button id="record-btn" class="record-btn">
          <span class="record-icon"><span class="record-dot"></span></span>
          <span id="record-label">Start recording</span>
        </button>

        <div class="progress" id="model-progress" hidden>
          <div class="progress-bar" id="model-progress-bar"></div>
          <span class="progress-label" id="model-progress-label"></span>
        </div>

        <div class="note-meta" id="note-meta" hidden>
          <span class="meta-label">Writing to</span>
          <span class="meta-value" id="note-name"></span>
        </div>

        <div class="transcript-preview" id="transcript-preview"></div>

        <footer class="footer">
          <button class="link-btn" id="open-note-btn" disabled>Open in Obsidian</button>
          <button class="link-btn" id="reveal-note-btn" disabled>Show in Finder</button>
        </footer>
      </section>

      <!-- Settings panel -->
      <section id="settings" class="settings-panel hidden">
        <header class="panel-header">
          <button class="icon-btn" id="settings-back" title="Back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h2>Settings</h2>
        </header>

        <div class="panel-body">
          <label class="field">
            <span class="field-label">Obsidian vault</span>
            <div class="row">
              <input type="text" id="vault-path" readonly placeholder="No vault selected" />
              <button class="ghost-btn" id="change-vault">Change…</button>
            </div>
          </label>

          <label class="field">
            <span class="field-label">Subfolder</span>
            <input type="text" id="subfolder" placeholder="Crouton" />
            <span class="field-hint">Inside your vault. Leave blank to save at the vault root.</span>
          </label>

          <label class="field">
            <span class="field-label">Whisper model</span>
            <select id="whisper-model">
              <option value="large-v3-turbo-q5_0">Large v3 Turbo · q5_0 (~550 MB, recommended)</option>
              <option value="large-v3-turbo">Large v3 Turbo (~1.6 GB)</option>
              <option value="large-v3-q5_0">Large v3 · q5_0 (~1.1 GB)</option>
              <option value="large-v3">Large v3 (~3.1 GB, best quality)</option>
              <option value="medium">Medium (~1.5 GB)</option>
              <option value="small">Small (~490 MB)</option>
              <option value="base">Base (~150 MB)</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Language</span>
            <select id="language">
              <option value="en">English</option>
              <option value="auto">Auto-detect</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="zh">Chinese</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Summary model (Ollama)</span>
            <select id="ollama-model"></select>
            <span class="field-hint" id="ollama-hint">Used to generate the meeting summary and action items.</span>
          </label>

          <div class="section-divider">Speaker diarization</div>

          <label class="field check-field">
            <input type="checkbox" id="diarize-enabled" />
            <span class="field-label inline">Identify speakers (WhisperX + pyannote)</span>
          </label>

          <label class="field">
            <span class="field-label">HuggingFace token</span>
            <input type="password" id="hf-token" placeholder="hf_..." />
            <span class="field-hint">Required by pyannote. Accept the model terms at <a href="#" data-url="https://huggingface.co/pyannote/segmentation-3.0">segmentation-3.0</a> and <a href="#" data-url="https://huggingface.co/pyannote/speaker-diarization-3.1">speaker-diarization-3.1</a>, then get a read token from <a href="#" data-url="https://huggingface.co/settings/tokens">settings/tokens</a>.</span>
          </label>

          <div class="field-row">
            <label class="field flex-half">
              <span class="field-label">Min speakers</span>
              <select id="min-speakers">
                <option value="0">Auto</option>
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
                <option value="5">5</option><option value="6">6</option>
              </select>
            </label>
            <label class="field flex-half">
              <span class="field-label">Max speakers</span>
              <select id="max-speakers">
                <option value="0">Auto</option>
                <option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option>
                <option value="6">6</option><option value="8">8</option>
              </select>
            </label>
          </div>

          <div class="status-line" id="diarize-status">Checking diarization…</div>

          <div class="section-divider"></div>

          <label class="field check-field">
            <input type="checkbox" id="launch-at-login" />
            <span class="field-label inline">Launch Crouton at login</span>
          </label>
        </div>
      </section>
    </div>

    <script src="menubar.js"></script>
  </body>
</html>
